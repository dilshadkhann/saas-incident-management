name: OpsHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opshub
          POSTGRES_PASSWORD: opshub
          POSTGRES_DB: opshub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opshub -d opshub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://opshub:opshub@localhost:5432/opshub_test
      TEST_DATABASE_URL: postgresql+psycopg://opshub:opshub@localhost:5432/opshub_test
      SECRET_KEY: ci-test-only-secret-key-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: alembic -c apps/api/alembic.ini upgrade head

      - name: Run backend tests
        run: python -m pytest apps/api/tests -v

      - name: Run Ruff lint
        run: ruff check apps/api/app apps/api/tests apps/api/migrations

      - name: Check Ruff formatting
        run: ruff format --check apps/api/app apps/api/tests apps/api/migrations

      - name: Check Python dependencies
        run: python -m pip check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Run frontend tests
        run: npm --prefix apps/web run test

      - name: Run ESLint
        run: npm --prefix apps/web run lint

      - name: Check Prettier formatting
        run: npm --prefix apps/web run format:check

      - name: Build frontend
        run: npm --prefix apps/web run build

      - name: Audit frontend dependencies
        run: npm --prefix apps/web audit
