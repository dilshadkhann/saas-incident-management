name: OpsHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest apps/api/tests -v

      - name: Run Ruff lint
        run: ruff check apps/api/app apps/api/tests

      - name: Check Ruff formatting
        run: ruff format --check apps/api/app apps/api/tests

      - name: Check Python dependencies
        run: python -m pip check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Run frontend tests
        run: npm --prefix apps/web run test

      - name: Run ESLint
        run: npm --prefix apps/web run lint

      - name: Check Prettier formatting
        run: npm --prefix apps/web run format:check

      - name: Build frontend
        run: npm --prefix apps/web run build

      - name: Audit frontend dependencies
        run: npm --prefix apps/web audit
